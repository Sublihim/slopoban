# Публикация статики на GitHub Pages при каждом пуше в master.
# Собирать нечего: репозиторий целиком и есть готовый сайт.
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Права токена, нужные для деплоя на Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Один деплой за раз; запущенный не прерываем.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Кэш Pages и WebView Telegram живут своей жизнью: без метки версии
      # игрок после релиза видит смесь старых и новых файлов. Правится копия
      # в раннере — в репозитории пути остаются чистыми, чтобы index.html
      # по-прежнему открывался с диска (file:// query-строку не переживает).
      - name: Cache-busting
        run: |
          sed -i -E 's#(href="css/[^"?]+|src="js/[^"?]+)"#\1?v='"${GITHUB_SHA::8}"'"#g' index.html
          grep -E 'href="css|src="js' index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
